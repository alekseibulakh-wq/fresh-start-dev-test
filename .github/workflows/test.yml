name: Fresh Start tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  # Preserve the status name already required by main protection.
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Lint
        run: ruff check .
      - name: Typecheck application
        run: mypy
      - name: Unit tests
        run: python -B -m unittest -v test_greeting test_health
      - name: HTTP integration tests
        run: python -B -m unittest discover -s tests/integration -v
      - name: Build wheel and source distribution
        run: python -m build --no-isolation
      - name: Verify installed wheel outside source tree
        run: |
          python -m venv /tmp/health-wheel
          /tmp/health-wheel/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/health-wheel/bin/python -c 'from health import application; assert b"".join(application({"PATH_INFO": "/health", "REQUEST_METHOD": "GET"}, lambda status, headers: None)) == b"{\"status\":\"ok\"}"'
      - name: Dependency audit including CI environment
        run: pip-audit --strict
      - name: SAST application
        run: bandit -r health.py -ll
      - name: Scan checkout for secrets
        run: python ci/check_secrets.py
