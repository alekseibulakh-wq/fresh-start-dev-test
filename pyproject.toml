[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "fresh-start-health-demo"
version = "0.1.0"
description = "Synthetic dependency-free WSGI health endpoint"
requires-python = ">=3.12"
dependencies = []

[tool.hatch.build.targets.wheel]
include = ["health.py"]

[tool.hatch.build.targets.sdist]
include = ["health.py", "test_*.py", "tests", "pyproject.toml", "README.md"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["health.py"]

[tool.ruff.lint]
select = ["E9", "F"]
